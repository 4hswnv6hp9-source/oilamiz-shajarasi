<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Bizning Shajara</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@700&display=swap">
<style>
:root{--bg:#f5ead6;--bg2:#e8d3a6;--card:#fffaf0;--ink:#2a1f12;--mut:#7a6648;--bd:#b98f4a;--co:#c4573d;--gold:#d49c1a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16110b;--bg2:#33260f;--card:#251d14;--ink:#f3e9d6;--mut:#b4a284;--bd:#a97f3f;--co:#e57f63;--gold:#f0c24f}}
:root[data-theme="dark"]{--bg:#16110b;--bg2:#33260f;--card:#251d14;--ink:#f3e9d6;--mut:#b4a284;--bd:#a97f3f;--co:#e57f63;--gold:#f0c24f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font:400 16px/1.45 Lora,Georgia,serif;background:radial-gradient(ellipse at 20% 0,var(--bg2),transparent 60%),var(--bg);background-repeat:no-repeat}
header{text-align:center;padding:22px 16px 6px}
.strip{height:16px;width:min(90%,520px);margin:0 auto 18px;background:repeating-linear-gradient(90deg,#d9785f 0 14px,transparent 14px 20px,#5ba8c0 20px 34px,transparent 34px 40px,#e5b94e 40px 54px,transparent 54px 60px)}
h1{margin:0;font:700 clamp(2rem,9vw,3.4rem)/1.1 "Playfair Display",Georgia,serif}
.sub{font-style:italic;color:var(--mut);margin:8px 0 14px;font-size:1.1rem}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chips span{border:1px solid var(--bd);border-radius:999px;padding:6px 18px}
.chips b{color:var(--co);font-size:1.15em}
.hint{color:var(--mut);font-size:14px;margin:14px auto 0;max-width:36ch}
#stage{overflow:auto;padding:22px 0 10px;-webkit-overflow-scrolling:touch}
#tree{position:relative;margin:0 auto}
#tree svg{position:absolute;inset:0;pointer-events:none}
svg path{fill:none;stroke:var(--bd);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.cd{position:absolute;width:152px;height:142px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px;background:var(--card);color:var(--ink);border:2px solid var(--bd);border-radius:18px;box-shadow:0 4px 0 var(--bd);font:inherit;cursor:pointer}
.cd.sel{border-color:var(--co);box-shadow:0 4px 0 var(--co)}
.cd.me{border-color:var(--gold);box-shadow:0 0 16px var(--gold)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font:700 22px "Playfair Display",Georgia,serif;font-style:normal;margin-bottom:3px}
.cd b{font:700 15px/1.2 "Playfair Display",Georgia,serif}
.cd span{font-size:14px}
.cd small{color:var(--mut);font-size:12.5px;line-height:1.3}
.cd em{color:var(--co);font-style:normal;font-size:12.5px}
.cd u{text-decoration:none;color:var(--gold);font-size:12.5px;font-weight:600}
.tg{position:absolute;width:50px;height:22px;border:0;border-radius:999px;background:#5ba8c0;color:#0f2229;font:600 12px Lora,serif;cursor:pointer;padding:0}
#info{max-width:560px;margin:10px auto 120px;box-sizing:border-box;width:calc(100% - 32px);border:2px dashed var(--bd);border-radius:22px;padding:18px 20px;text-align:center;background:var(--card)}
#info[hidden]{display:none}
#info h3{margin:0 0 6px;font:700 24px/1.2 "Playfair Display",Georgia,serif}
#info p{margin:5px 0}
.chip{display:inline-block;background:#5ba8c0;color:#0f2229;border-radius:999px;padding:2px 14px;font-size:13px;margin-bottom:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;gap:8px;padding:8px;border:1px solid var(--bd);border-radius:999px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px)}
nav button{border:0;border-radius:999px;padding:10px 16px;color:#fff;font:600 14px Lora,serif;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="strip"></div>
  <h1>🌳 Bizning Shajara</h1>
  <p class="sub">Ildizlardan shoxlargacha — oilamiz tarixi</p>
  <div class="chips"><span>Avlodlar: <b id="ng"></b></span><span>Oila a’zolari: <b id="nm"></b></span></div>
  <p class="hint">Kartani bosing — ma’lumot chiqadi. Pastdagi ko‘k tugma shoxni ochadi.</p>
</header>
<main id="stage"><div id="tree"></div></main>
<section id="info" hidden></section>
<nav><div>
  <button id="open" style="background:#4d8f55">Hammasini och</button>
  <button id="fold" style="background:#c9792a">Yig‘ish</button>
</div></nav>
<script>
const COL=['#b9573f','#3d7f93','#7e5aa2','#4d8f55','#c88a2a'],CW=152,CH=142,GX=18,GY=54,PAD=24;
const $=s=>document.querySelector(s);
const D=(n,s,y,o,c)=>Object.assign({n,s,y,c:c||[]},o);
const R=D('Sopor','','',{},[
 D('Ahmad','Soporov','',{},[
  D('Boboyor','Soporov','',{sp:'Qasiyat Soporova'},[D('Temur','Soporov','1970–2000'),D('Madina','','1980–2005',{f:1})]),
  D('Muhammad','Soporov','',{},[D('Shirina','','1961–1985',{f:1})]),
  D('Yusuf','Soporov','',{},[D('Sirojiddin','Soporov','1950–1980')]),
  D('Rayhon','','2003–2019',{f:1}),
  D('Sevara','','2006–2024',{f:1})
 ]),
 D('Karim','','',{},[
  D('Muxabbat','Karimova','1962',{f:1}),
  D('Sharofiddin','Karimov','1964'),
  D('Shirin','Karimova','1966',{f:1}),
  D('Shuhrat','Karimov','1968'),
  D('Muqaddas','Karimova','1970',{f:1}),
  D('Muxammad','Karimov','1972'),
  D('G‘ayrat','Karimov','1973'),
  D('Abduvali','Karimov','1976'),
  D('Abdug‘ani','Karimov','1978'),
  D('Farxod','Karimov','1980'),
  D('Furqat','Karimov','1983')
 ])
]);
const I=[],tree=$('#tree'),info=$('#info');let md=0,sel=null;
(function init(n,p,g){n.id=I.length;I.push(n);n._p=p;n.g=g;n.col=false;n.c.forEach(c=>init(c,n,g+1))})(R,null,1);
const cnt=n=>1+n.c.reduce((a,c)=>a+cnt(c),0);
const kids=n=>n.col?[]:n.c;
function meas(n){const k=kids(n);k.forEach(meas);n._k=k.reduce((a,c)=>a+c._w,0)+GX*Math.max(0,k.length-1);n._w=Math.max(CW,n._k)}
function place(n,x,d){const k=kids(n);n._cx=x+n._w/2;n._d=d;n._y=PAD+d*(CH+GY);md=Math.max(md,d);let cx=x+(n._w-n._k)/2;k.forEach(c=>{place(c,cx,d+1);cx+=c._w+GX})}
const card=n=>{
  const dead=n.y.includes('–');
  return `<button class="cd${sel===n?' sel':''}${n.tag?' me':''}" data-id="${n.id}" style="left:${n._cx-CW/2}px;top:${n._y}px;--c:${COL[(n.g-1)%5]}"><i class="av">${n.n[0]}</i><b>${n.n}</b>${n.s?`<span>${n.s}</span>`:''}${n.y?`<small>${dead?'🕊':'🎂'} ${n.y}</small>`:''}<small>${n.g}-avlod</small>${n.sp?`<em>💍 ${n.sp.split(' ')[0]}</em>`:''}${n.tag?`<u>⭐ ${n.tag}</u>`:''}</button>`;
};
function draw(){
  md=0;meas(R);place(R,PAD,0);
  let h='',d='';
  (function go(n){
    h+=card(n);
    const k=kids(n);
    if(n.c.length)h+=`<button class="tg" data-t="${n.id}" style="left:${n._cx-25}px;top:${n._y+CH-11}px" aria-label="Shoxni ochish yoki yopish">${n.col?'▸':'▾'} ${n.c.length}</button>`;
    if(k.length){
      const y0=n._y+CH+11,ey=n._y+CH+GY,ym=(y0+ey)/2;
      d+=`M${n._cx} ${y0}V${ym}`;
      if(k.length>1)d+=`M${k[0]._cx} ${ym}H${k[k.length-1]._cx}`;
      k.forEach(c=>{d+=`M${c._cx} ${ym}V${ey}`});
    }
    k.forEach(go);
  })(R);
  const W=R._w+PAD*2,H=PAD*2+(md+1)*(CH+GY)-GY+6;
  tree.style.width=W+'px';tree.style.height=H+'px';
  tree.innerHTML=`<svg width="${W}" height="${H}"><path d="${d}"/></svg>`+h;
}
function show(n){
  const p=n._p,tot=cnt(n)-1;
  info.hidden=false;
  info.innerHTML=`<h3>${n.n} ${n.s}</h3><span class="chip">${n.g}-avlod</span>`
    +(n.y?`<p>${n.y.includes('–')?'Hayot yillari':'Tug‘ilgan yili'}: ${n.y}</p>`:'')
    +(p?`<p>${p.n}ning ${n.f?'qizi':'o‘g‘li'}</p>`:'')
    +(n.sp?`<p>Turmush o‘rtog‘i: ${n.sp}</p>`:'')
    +(n.c.length?`<p>Farzandlari: ${n.c.map(c=>c.n).join(', ')}</p>`:'')
    +(tot?`<p>Jami avlodi: ${tot} kishi</p>`:'');
  info.scrollIntoView({behavior:'smooth',block:'center'});
}
tree.onclick=e=>{
  const t=e.target.closest('.tg');
  if(t){const n=I[t.dataset.t];n.col=!n.col;draw();return}
  const c=e.target.closest('.cd');
  if(c){sel=I[c.dataset.id];draw();show(sel)}
};
$('#open').onclick=()=>{I.forEach(n=>{n.col=false});draw()};
$('#fold').onclick=()=>{I.forEach(n=>{n.col=n.c.length>0});draw()};
$('#ng').textContent=Math.max(...I.map(n=>n.g));
$('#nm').textContent=I.length;
draw();
{const s=$('#stage');s.scrollLeft=(s.scrollWidth-s.clientWidth)/2}
</script>
</body>
</html>
